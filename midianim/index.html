<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>midianim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container-fluid py-4">
        <div class="row mb-3">
            <div class="col-12">
                <div class="header-controls">
                    <div class="d-flex gap-2 align-items-center">
                        <button class="btn btn-icon" id="playPauseBtn" disabled data-state="play" title="Play">
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <button class="btn btn-icon" id="rewindBtn" disabled title="Rewind 5s">
                            <i class="bi bi-skip-backward-fill"></i>
                        </button>
                        <button class="btn btn-icon" id="fastForwardBtn" disabled title="Fast Forward 5s">
                            <i class="bi bi-skip-forward-fill"></i>
                        </button>
                        <button class="btn btn-icon" id="resetBtn" disabled title="Reset">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                        <span class="badge bg-light text-dark" id="timeInfo">Time: 0.00s</span>
                    </div>

                    <div class="audio-container">
                        <audio id="audioPlayer" controls></audio>
                    </div>

                    <div class="d-flex gap-3 align-items-center">
                        <div class="file-input-group">
                            <input type="file" class="form-control form-control-sm" id="midiFile" accept=".mid,.midi"
                                style="width: auto;">
                            <label for="midiFile" class="file-input-label">MIDI</label>
                        </div>
                        <div class="file-input-group">
                            <input type="file" class="form-control form-control-sm" id="audioFile" accept="audio/*"
                                style="width: auto;">
                            <label for="audioFile" class="file-input-label">Audio</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="showTracksToggle" checked>
                            <label class="form-check-label" for="showTracksToggle">
                                Show Track Clusters
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">

                <div class="row mb-4">
                    <div class="col-lg-8">
                        <div class="card shadow-lg">
                            <div class="card-body p-0">
                                <canvas id="eclipseCanvas" class="w-100 d-block"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card shadow-lg">
                            <div class="card-body">
                                <div id="debugInfo" class="font-monospace small"
                                    style="max-height: 765px; overflow-y: auto;">
                                    Load a MIDI file to see debug information...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="card mb-4 shadow-lg">
                    <div class="card-header bg-secondary text-white">
                        <div class="d-flex flex-wrap gap-3 align-items-center">
                            <div>
                                <label for="timelineDisplayMode" class="form-label mb-0 me-2">Timelines:</label>
                                <select id="timelineDisplayMode" class="form-select form-select-sm" style="width: auto; display: inline-block;">
                                    <option value="none">Don't Show</option>
                                    <option value="compressed">Show Compressed</option>
                                    <option value="expanded" selected>Show Expanded</option>
                                </select>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="showCombinedTimelineToggle">
                                <label class="form-check-label" for="showCombinedTimelineToggle">
                                    Show Combined Timeline
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" id="trackInfo" style="max-height: 800px; overflow-y: auto;">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="midi-animation.js"></script>
</body>

</html>
